<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Scalp City · Character Motion Checker</title><style>body{margin:0;background:#101920;color:#edf4f4;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}.ui{position:fixed;top:12px;left:12px;max-width:330px;background:#17242de8;border:1px solid #58717b;border-radius:12px;padding:13px}.ui b{font-size:17px}.ui p{font-size:12px;color:#a9c2c8}.controls{position:fixed;bottom:18px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}button,select,label{background:#293e47;color:white;border:1px solid #6b8991;padding:10px;border-radius:9px;font:inherit}button:active{background:#bc8a4d}.tag{color:#ffcb76}input{display:none}#status{font-size:11px;white-space:pre-line}</style><div class="ui"><b>SCALP CITY · MOTION CHECKER</b><p>Industrial character room · 6 instances · drag to orbit · pinch to zoom</p><div id="status">Loading character GLBs…</div><p class="tag">Preview animations use articulated node transforms; not yet skeletal rigging or production animation.</p><a style="color:#91d4e3" href="../mesh-qa/">Original mesh checker</a></div><div class="controls"><select id="motion"><option value="idle">Idle</option><option value="walk">Walk</option><option value="run">Run</option><option value="action">Action / work</option><option value="wave">Gesture</option></select><button id="pause">Pause</button><button id="reset">Reset view</button><label>Load Operator + Worker GLBs<input type="file" id="files" accept=".glb" multiple></label></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#111d24');scene.fog=new THREE.Fog('#111d24',15,34);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(7,5,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.02;controls.update();scene.add(new THREE.HemisphereLight(0xb3d9ee,0x293138,2.1));const light=new THREE.DirectionalLight(0xffd4a1,2.4);light.position.set(-4,9,6);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
const mat=(c,m=.5)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:.65});const floor=new THREE.Mesh(new THREE.BoxGeometry(18,.22,14),mat('#293b41'));floor.position.y=-.12;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(18,18,0x58727a,0x364e55);grid.position.y=.01;scene.add(grid);
for(const x of [-8.7,8.7]){const wall=new THREE.Mesh(new THREE.BoxGeometry(.25,5,14),mat('#34464b'));wall.position.set(x,2.5,0);scene.add(wall)}const back=new THREE.Mesh(new THREE.BoxGeometry(18,5,.25),mat('#263840'));back.position.set(0,2.5,-6.8);scene.add(back);
for(const x of [-5,0,5]){const tube=new THREE.Mesh(new THREE.BoxGeometry(2.5,.09,.13),new THREE.MeshStandardMaterial({color:0x86c9d6,emissive:0x2d899d,emissiveIntensity:1}));tube.position.set(x,4.2,-6.55);scene.add(tube)}
const slots=[[-4,-2],[-1.5,-2],[1.5,-2],[4,-2],[-2,2],[2,2]];const actors=[];let active=true;const status=document.querySelector('#status');
function actor(source,i){const root=source.clone(true);root.position.set(slots[i][0],0,slots[i][1]);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3());const s=(i%2===1?1.8:2)/Math.max(size.y,.01);root.scale.setScalar(s);root.position.y-=box.min.y*s;root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(root);actors.push({root,parts:[...root.children],phase:i*1.1});}
function fallback(i){const root=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.7,.8,.38),mat(i%2?'#b48648':'#8799a0'));body.position.y=1.35;root.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.42,.36,.4),mat('#26363e'));head.position.y=1.96;root.add(head);for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.19,.75,.21),mat('#65777d'));arm.position.set(side*.52,1.32,0);arm.name=side<0?'LeftUpperArm':'RightUpperArm';root.add(arm);const leg=new THREE.Mesh(new THREE.BoxGeometry(.23,.85,.27),mat('#58686e'));leg.position.set(side*.22,.48,0);leg.name=side<0?'LeftThigh':'RightThigh';root.add(leg)}actor(root,i)}
for(let i=0;i<6;i++)fallback(i);status.textContent='Fallback stand-ins displayed until GLBs load.\n';
const urls=['https://api.thrixel.com/api/v1/9b342eda-19f7-44d2-bde0-415c99884de8/download?format=glb&textures=webp&draco=false','https://api.thrixel.com/api/v1/283d84ff-c560-4c88-bec5-0089b65c4de7/download?format=glb&textures=webp&draco=false'];const loader=new GLTFLoader();
function replace(kind,gltf){for(let i=kind;i<6;i+=2){scene.remove(actors[i].root);const obj=gltf.scene.clone(true);const b=new THREE.Box3().setFromObject(obj),s=(kind?1.8:2)/b.getSize(new THREE.Vector3()).y;obj.scale.setScalar(s);obj.position.set(slots[i][0],-b.min.y*s,slots[i][1]);obj.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(obj);actors[i]={root:obj,phase:i*1.1}}status.textContent+='Loaded '+(kind?'Worker':'Operator')+' ×3\n'}
urls.forEach((u,i)=>loader.load(u,g=>replace(i,g),undefined,e=>{status.textContent+='Remote '+(i?'Worker':'Operator')+' blocked: use Load GLBs.\n';console.warn(e)}));
document.querySelector('#files').onchange=async e=>{const files=[...e.target.files];for(let i=0;i<Math.min(files.length,2);i++){const buffer=await files[i].arrayBuffer();loader.parse(buffer,'',g=>replace(i,g),err=>status.textContent+='Import failed: '+err.message+'\n')}};
const motion=document.querySelector('#motion');document.querySelector('#pause').onclick=()=>{active=!active;document.querySelector('#pause').textContent=active?'Pause':'Play'};document.querySelector('#reset').onclick=()=>{camera.position.set(7,5,10);controls.target.set(0,1,0)};
let t=0,prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;if(active)t+=dt;for(const a of actors){const mode=motion.value,rate=mode==='run'?8:mode==='walk'?4:2,cycle=t*rate+a.phase;a.root.traverse(o=>{const n=o.name.toLowerCase();if(!/arm|thigh|shin|head|torso/.test(n)||!o.isGroup&&!o.isMesh)return;const left=/left/.test(n)?1:/right/.test(n)?-1:0;const upper=/upperarm|upper_arm/.test(n),leg=/thigh/.test(n),head=/head/.test(n);if(mode==='idle'){if(head)o.rotation.y=Math.sin(cycle*.3)*.12;if(upper)o.rotation.x=Math.sin(cycle*.5)*.035}else if(mode==='walk'||mode==='run'){if(leg)o.rotation.x=left*Math.sin(cycle)*.4;if(upper)o.rotation.x=-left*Math.sin(cycle)*.33;if(head)o.rotation.y=0}else if(mode==='action'){if(upper)o.rotation.x=-.6+Math.sin(cycle)*.4;if(head)o.rotation.y=.08}else if(mode==='wave'){if(upper)o.rotation.z=left===-1?-1.2:0;if(head)o.rotation.y=-.12}})}controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
