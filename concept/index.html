<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#86c8d7"><title>Scalp City — Stylised Atrium Concept</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#9bd7e3;color:#233548}canvas{display:block;touch-action:none}.hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;align-items:start;padding:16px;pointer-events:none}.brand,.status{background:#fffae9e8;border:3px solid #415866;border-radius:15px;padding:10px 14px;box-shadow:0 5px 0 #41586635}.brand b{display:block;font-size:17px;letter-spacing:.05em}.brand small,.status small{font-size:10px;font-weight:800}.status{text-align:right}.status b{display:block}.joy{position:fixed;left:22px;bottom:calc(45px + env(safe-area-inset-bottom));height:138px;width:138px;border-radius:50%;background:#f9f4dcaa;border:4px solid #41586688;touch-action:none;box-shadow:0 7px 0 #41586625}.knob{position:absolute;left:34px;top:34px;width:62px;height:62px;border-radius:50%;background:#f6cb72;border:4px solid #4b6370;box-shadow:0 5px 0 #b7873c;pointer-events:none}.actions{position:fixed;right:20px;bottom:calc(52px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}.actions button,.dialog button{border:3px solid #415866;border-radius:17px;background:#f8d17b;color:#243f50;font-weight:900;font-size:15px;padding:14px 19px;box-shadow:0 5px 0 #526371;cursor:pointer}.actions button:nth-child(2){background:#d4f3ee}.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(360px,90vw);background:#fff8e8;border:4px solid #425c69;border-radius:22px;padding:24px;text-align:center;box-shadow:0 12px 0 #425c6955;z-index:5}.dialog h2{margin:0 0 8px}.dialog p{font-size:13px}.floors{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.floors button{font-size:12px;padding:10px}.dialog .close{background:#e8eee8;margin-top:15px}.help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:#fff9e3cc;border-radius:8px;padding:5px 10px;font-weight:800;pointer-events:none}.prompt{position:fixed;left:50%;bottom:calc(75px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff6d8;border:3px solid #45606b;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:800;white-space:nowrap}.dialog[hidden],.prompt[hidden]{display:none!important}@media(max-width:520px){.status{font-size:12px}.brand b{font-size:14px}.help{font-size:9px}.joy{left:14px;bottom:calc(48px + env(safe-area-inset-bottom))}}</style></head><body>
<div class="hud"><div class="brand"><b>☀ SCALP CITY</b><small>THE LIVING FOUNDRY · ART TEST</small></div><div class="status"><small>GROUND FLOOR</small><b>THE ATRIUM</b><small>ILLUSTRATIVE SCENE</small></div></div>
<div id="joy" class="joy" aria-label="Movement joystick"><div id="knob" class="knob"></div></div><div class="actions"><button id="interact">✦ INTERACT</button><button id="lift">↟ LIFT</button></div><div class="prompt" id="prompt" hidden>✦ Approach the golden lift to travel</div><div class="help">LEFT JOYSTICK MOVE · DRAG WORLD TO ROTATE · LIFT FOR FLOOR SELECT</div>
<div id="dialog" class="dialog" hidden><h2 id="dialogTitle">Lift</h2><p id="dialogDesc">Choose a destination.</p><div id="floorButtons" class="floors"></div><button id="close" class="close">CLOSE</button></div>
<script type="module" src="./atrium.js"></script></body></html>
